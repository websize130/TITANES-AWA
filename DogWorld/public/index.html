<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#5a2d91" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>DogWorld: El Despertar del Castillo</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" aria-label="Mundo 3D de DogWorld"></canvas>

    <!-- HUD de partida: ultra limpio, sin marcas ni logos -->
    <div id="hud" class="hidden" aria-live="polite">
      <div class="hud-top-left">
        <div class="hud-pill" id="hud-bones" title="Huesos dorados">
          <svg class="hud-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4a2.5 2.5 0 0 0-2.4 3.2A2.5 2.5 0 1 0 7.2 11L13 16.8a2.5 2.5 0 1 0 3.8 2.1 2.5 2.5 0 1 0 2.1-3.8L13 9.2A2.5 2.5 0 1 0 9 5.1 2.5 2.5 0 0 0 7.5 4z"/></svg>
          <span id="hud-bones-count">0</span>
        </div>
      </div>
      <div class="hud-top-right">
        <div class="hud-pill hud-small" id="hud-players" title="Jugadores en la sala">
          <span class="dot" id="hud-net-dot"></span><span id="hud-players-count">1</span>
        </div>
        <button class="hud-btn" id="hud-pause" aria-label="Pausa">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
        </button>
      </div>
      <div id="hud-toast" class="hud-toast"></div>
      <!-- Habilidad (PC): icono, tecla y cooldown -->
      <div class="hud-ability ability-btn hidden" id="hud-ability">
        <span class="ab-icon">🎉</span><span class="cd-fill"></span>
        <span class="ab-key">E</span>
        <span class="ab-emote">Q gesto</span>
      </div>
      <div class="hud-buff" id="hud-buff"></div>
    </div>

    <!-- Controles táctiles (solo dispositivos táctiles) -->
    <div id="touch-layer" class="hidden">
      <div id="touch-move-zone"></div>
      <div id="touch-look-zone"></div>
      <div id="joystick" class="joystick hidden"><div class="joystick-knob"></div></div>
      <button class="touch-btn touch-jump" id="btn-jump" aria-label="Saltar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l7 8h-4v6H9v-6H5z"/></svg>
      </button>
      <button class="touch-btn touch-action ability-btn" id="btn-action" aria-label="Habilidad">
        <span class="ab-icon">🎉</span><span class="cd-fill"></span>
      </button>
      <button class="touch-btn touch-emote" id="btn-emote" aria-label="Gesto de personalidad">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-1.7 0-3 1.6-3 3.5S10.3 10 12 10s3-1.6 3-3.5S13.7 3 12 3zM5.5 8C4.1 8 3 9.3 3 11s1.1 3 2.5 3S8 12.7 8 11 6.9 8 5.5 8zm13 0C17.1 8 16 9.3 16 11s1.1 3 2.5 3S21 12.7 21 11s-1.1-3-2.5-3zM12 12c-3 0-6 3.3-6 6 0 1.7 1.3 3 3 3 1.2 0 2-.6 3-.6s1.8.6 3 .6c1.7 0 3-1.3 3-3 0-2.7-3-6-6-6z"/></svg>
      </button>
    </div>

    <!-- Selección de raza: tarjetas interactivas + vista 3D animada -->
    <div id="breed-select" class="select hidden">
      <header class="select-head">
        <button class="btn-ghost btn-small" id="sel-back">← Volver</button>
        <h2>Elige tu perro</h2>
        <span class="sel-room" id="sel-room"></span>
      </header>
      <div class="select-body">
        <div class="select-cards" id="sel-cards" role="listbox" aria-label="Razas"></div>
        <section class="select-preview" aria-live="polite">
          <div class="preview-stage">
            <canvas id="preview-canvas" aria-label="Vista 3D del perro"></canvas>
            <div class="preview-tag" id="pv-tag"></div>
          </div>
          <div class="preview-info">
            <h3 id="pv-name"></h3>
            <p class="pv-breed" id="pv-breed"></p>
            <p class="pv-personality" id="pv-personality"></p>
            <div class="pv-ability">
              <span class="pv-ab-icon" id="pv-ab-icon"></span>
              <div><strong id="pv-ab-name"></strong><p id="pv-ab-desc"></p></div>
            </div>
            <div class="pv-stats" id="pv-stats"></div>
            <button class="btn-primary" id="sel-confirm">¡Jugar!</button>
            <p class="menu-status" id="sel-status"></p>
          </div>
        </section>
      </div>
    </div>

    <!-- Menú principal: único lugar donde aparece la marca -->
    <div id="menu" class="menu">
      <div class="menu-card">
        <div class="brand">
          <svg class="brand-paw" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-1.7 0-3 1.6-3 3.5S10.3 10 12 10s3-1.6 3-3.5S13.7 3 12 3zM5.5 8C4.1 8 3 9.3 3 11s1.1 3 2.5 3S8 12.7 8 11 6.9 8 5.5 8zm13 0C17.1 8 16 9.3 16 11s1.1 3 2.5 3S21 12.7 21 11s-1.1-3-2.5-3zM12 12c-3 0-6 3.3-6 6 0 1.7 1.3 3 3 3 1.2 0 2-.6 3-.6s1.8.6 3 .6c1.7 0 3-1.3 3-3 0-2.7-3-6-6-6z"/></svg>
          <h1>DogWorld</h1>
          <p class="subtitle">El Despertar del Castillo</p>
        </div>

        <form id="menu-form" autocomplete="off">
          <label>Nombre
            <input id="input-name" maxlength="16" placeholder="Perrito" />
          </label>
          <label>Sala
            <input id="input-room" maxlength="8" placeholder="HUB" />
          </label>
          <button type="submit" class="btn-primary" id="btn-play">Elegir perro</button>
          <button type="button" class="btn-ghost hidden" id="btn-change-dog">Cambiar de perro</button>
        </form>

        <div class="menu-row">
          <button class="btn-ghost" id="btn-fullscreen">Pantalla completa</button>
          <button class="btn-ghost" id="btn-share">Invitar</button>
        </div>
        <p class="menu-status" id="menu-status"></p>
        <p class="menu-help" id="menu-help"></p>
        <p class="credits">© DogWorld · Three.js</p>
      </div>
    </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
