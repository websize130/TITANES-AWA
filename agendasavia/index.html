<script>
/* ===== Arranque: acceso exclusivo para profesionales y almacenamiento separado por centro ===== */
(function(){
  let L=null;try{L=window.localStorage}catch(e){}
  const rd=k=>{try{return L.getItem(k)}catch(e){return null}};
  window.asAcc=()=>{try{return JSON.parse(rd('as3_clean_accounts')||'[]')||[]}catch(e){return[]}};
  window.asSave=l=>{try{L.setItem('as3_clean_accounts',JSON.stringify(l))}catch(e){}};
  const ses=rd('as3_clean_session');
  window.AS_SLUG=(ses&&asAcc().some(a=>a.slug===ses))?ses:null;
  window.asMe=()=>asAcc().find(a=>a.slug===window.AS_SLUG)||null;
  /* Cuenta maestra: acceso al Dashboard de Master Admin */
  window.AS_ADMIN_EMAIL='websize130@gmail.com';
  window.asIsMaster=a=>!!a&&String(a.user||'').toLowerCase()===AS_ADMIN_EMAIL;
  /* Cuenta VIP: plan gratuito e ilimitado, exclusivo para este correo */
  window.AS_VIP_EMAIL='aurabeuty2026@gmail.com';
  window.asIsVipUser=u=>String(u||'').trim().toLowerCase()===AS_VIP_EMAIL;
  window.asKeys=()=>{const p='s:'+window.AS_SLUG+':';try{return Object.keys(localStorage).filter(k=>k.startsWith(p)).map(k=>k.slice(p.length)).filter(k=>k!=='as3_clean_sync'&&k!=='as3_clean_dirty')}catch(e){return[]}};
  /* Las claves de datos del centro se guardan con prefijo s:<centro>: ; las globales (cuentas, sesión, cookies, promos) no. */
  const GLOBAL=['as3_clean_accounts','as3_clean_session','as3_clean_cookies','as3_clean_promo','as3_clean_token'];
  const pk=k=>(window.AS_SLUG&&/^as3_clean/.test(k)&&GLOBAL.indexOf(k)<0)?'s:'+window.AS_SLUG+':'+k:k;
  ['getItem','setItem','removeItem'].forEach(m=>{const o=Storage.prototype[m];
    Storage.prototype[m]=function(k,v){
      if(m!=='setItem')return o.call(this,pk(k));
      const r=o.call(this,pk(k),v);
      try{if(window.asSyncMark&&this===window.localStorage)window.asSyncMark(k)}catch(e){}   /* v6: marca para subir a Supabase */
      return r}});
  /* Códigos promocionales: contador global de canjeos (no depende de ningún centro) y límite de usos */
  window.AS_PROMO_LIM={};   /* BIENVENIDA30 no tiene límite de usos */
  const pAll=()=>{try{const o=JSON.parse(rd('as3_clean_promo')||'{}');return(o&&typeof o==='object')?o:{}}catch(e){return{}}};
  window.asPromoUses=c=>Math.max(0,parseInt(pAll()[c],10)||0);
  window.asPromoFull=c=>Object.prototype.hasOwnProperty.call(AS_PROMO_LIM,c)&&asPromoUses(c)>=AS_PROMO_LIM[c];
  window.asPromoRedeem=c=>{const o=pAll();o[c]=asPromoUses(c)+1;try{L.setItem('as3_clean_promo',JSON.stringify(o))}catch(e){}return o[c]};
})();
</script>
<script>
/* ===== SUPABASE (v6): cuentas, datos y operativa en la nube, con caché local ===== */
(function(){
const SUPABASE_URL="https://bwiiyqgrvsttedalyhdw.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ3aWl5cWdydnN0dGVkYWx5aGR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NzI4NzQsImV4cCI6MjEwNzU0ODg3NH0.COnDW6tDwhTnMRpgLzkRVBP9QHaal9kNkcVJmtYnDVE";
let sb=null;
function getSb(){
  if(sb)return sb;
  try{if(window.supabase&&window.supabase.createClient)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}})}catch(e){console.warn('Supabase no disponible',e)}
  return sb;
}
window.asHasCloud=()=>!!getSb();
/* Llamada RPC con tiempo máximo. Nunca lanza: devuelve {data} o {error,offline} */
window.asRpc=async function(fn,args,ms){
  const c=getSb();if(!c)return{error:{message:'sin-cliente'},offline:true};
  try{
    const r=await Promise.race([c.rpc(fn,args||{}),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),ms||9000))]);
    if(r&&r.error)return{error:r.error,offline:!r.error.code};
    return{data:r?r.data:null};
  }catch(e){return{error:e,offline:true}}
};
window.asToken=()=>{try{return localStorage.getItem('as3_clean_token')||''}catch(e){return''}};
window.asSetToken=t=>{try{if(t)localStorage.setItem('as3_clean_token',t);else localStorage.removeItem('as3_clean_token')}catch(e){}};
window.asCacheAccount=function(a){const l=asAcc(),i=l.findIndex(x=>x.slug===a.slug);if(i>=0)l[i]={...l[i],...a};else l.push(a);asSave(l)};
window.asPushAccount=function(){const a=asMe(),t=asToken();if(a&&t)asRpc('as_update_account',{p_slug:a.slug,p_token:t,p_center:a.center,p_phone:a.phone||''},6000)};
/* Contador GLOBAL de canjeos: la verdad está en Supabase; localStorage queda como caché/fallback */
window.asPromoRefresh=async function(){
  const r=await asRpc('as_promo_uses',{p_codes:Object.keys(AS_PROMO_LIM)},6000);
  if(r.data&&typeof r.data==='object'&&!Array.isArray(r.data)){
    try{const o={};Object.keys(AS_PROMO_LIM).forEach(c=>o[c]=Math.max(0,parseInt(r.data[c],10)||0));localStorage.setItem('as3_clean_promo',JSON.stringify(o))}catch(e){}
    return true;
  }
  return false;
};

/* ---- Sincronización del panel profesional ---- */
const SYNC_KEYS={'as3_clean':'datos','as3_clean_ops':'operativa','as3_clean_day':'operativa','as3_clean_future':'operativa'};
const ver={datos:0,operativa:0};let applying=false,timer=null,busy=false,authWarned=false;
const jget=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:(JSON.parse(v)??d)}catch(e){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const has=k=>{try{return localStorage.getItem(k)!=null}catch(e){return false}};
window.asSyncMark=function(k){
  if(applying||!window.AS_SLUG)return;const b=SYNC_KEYS[k];if(!b)return;
  ver[b]++;const d=jget('as3_clean_dirty',{});if(!d[b]){d[b]=1;jset('as3_clean_dirty',d)}
  clearTimeout(timer);timer=setTimeout(push,900);
};
function payload(b){
  if(b==='datos'){const s=jget('as3_clean',null);return s?{c:s.c||[],s:s.s||[],p:s.p||[]}:null}
  const ops=jget('as3_clean_ops',null),day=jget('as3_clean_day',null),future=jget('as3_clean_future',null);
  return(ops||day||future)?{ops,day,future:future||[]}:null;
}
function authBad(){if(!authWarned){authWarned=true;try{toast('Sesión en la nube caducada: vuelve a iniciar sesión para sincronizar. Tus datos siguen guardados en este dispositivo.')}catch(e){}}}
async function push(){
  if(busy||!window.AS_SLUG)return;const tok=asToken();if(!tok)return;
  const todo=Object.keys(jget('as3_clean_dirty',{})).filter(b=>jget('as3_clean_dirty',{})[b]);if(!todo.length)return;
  busy=true;let again=false;
  try{
    for(const b of todo){
      const v0=ver[b],p=payload(b);
      if(!p){const d=jget('as3_clean_dirty',{});delete d[b];jset('as3_clean_dirty',d);continue}
      const r=await asRpc('as_save',{p_slug:AS_SLUG,p_token:tok,p_kind:b,p_data:p},15000);
      if(r.data&&r.data.ok){
        const st=jget('as3_clean_sync',{});st[b]=r.data.ts;jset('as3_clean_sync',st);
        if(ver[b]===v0){const d=jget('as3_clean_dirty',{});delete d[b];jset('as3_clean_dirty',d)}else again=true;
      }else{if(r.data&&r.data.error==='unauthorized')authBad();break}   /* sin red: queda pendiente y se reintenta */
    }
  }finally{busy=false}
  if(again)setTimeout(push,300);
}
async function pull(){
  if(!window.AS_SLUG)return;const tok=asToken();if(!tok)return;
  const r=await asRpc('as_load',{p_slug:AS_SLUG,p_token:tok},12000);
  if(!r.data)return;if(r.data.error==='unauthorized'){authBad();return}if(r.data.error)return;
  const dirty=jget('as3_clean_dirty',{}),st=jget('as3_clean_sync',{});let applied=false,needPush=false;
  const dd=r.data.datos;
  if(dd){
    if(!dirty.datos&&st.datos!==dd.ts){applying=true;try{localStorage.setItem('as3_clean',JSON.stringify(dd.data))}finally{applying=false}st.datos=dd.ts;applied=true}
  }else if(has('as3_clean')&&!dirty.datos){dirty.datos=1;needPush=true}      /* primera subida (migración desde el dispositivo) */
  const oo=r.data.operativa;
  if(oo){
    if(!dirty.operativa&&st.operativa!==oo.ts){
      applying=true;
      try{const o=oo.data||{};
        if(o.ops)localStorage.setItem('as3_clean_ops',JSON.stringify(o.ops));
        if(o.day)localStorage.setItem('as3_clean_day',JSON.stringify(o.day));
        if(o.future)localStorage.setItem('as3_clean_future',JSON.stringify(o.future));
      }finally{applying=false}
      st.operativa=oo.ts;applied=true;
    }
  }else if((has('as3_clean_ops')||has('as3_clean_day')||has('as3_clean_future'))&&!dirty.operativa){dirty.operativa=1;needPush=true}
  jset('as3_clean_sync',st);jset('as3_clean_dirty',dirty);
  if(applied&&window.asRehydrate)window.asRehydrate();
  const ib=Array.isArray(r.data.inbox)?r.data.inbox:[];
  if(ib.length&&window.asConsumeInbox){
    const rids=window.asConsumeInbox(ib);
    if(rids.length)await asRpc('as_ack_inbox',{p_slug:AS_SLUG,p_token:tok,p_rids:rids},9000);
  }
  if(needPush)push();
}
async function sync(){try{await push();await pull()}catch(e){console.warn('sync',e)}}
window.asSync=sync;
window.asFlush=async function(){const d=jget('as3_clean_dirty',{});if(Object.keys(d).length){clearTimeout(timer);await push()}};
window.addEventListener('load',()=>{if(window.AS_SLUG)sync()});
window.addEventListener('online',()=>{if(window.AS_SLUG)sync()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&window.AS_SLUG)sync()});
setInterval(()=>{if(window.AS_SLUG&&!document.hidden)sync()},30000);
})();
</script>
<script>
/* ---------- Datos ---------- */
const SERVICES = [
  {id:'corte', name:'Corte', dur:45, price:25, color:'#2563EB', g:'Unisex'},
  {id:'color', name:'Color', dur:90, price:55, color:'#7C3AED', g:'Mujer'},
  {id:'manicura', name:'Manicura', dur:60, price:22, color:'#059669', g:'Unisex'}
];
const PROS = [];
const GEN_OPTS = ['Unisex', 'Ambos', 'Mujer', 'Hombre', 'Niña', 'Niño'];
let nid = 1;
const CLIENTS = [];
const GIFTS = [];
let appts = [];
let blocks = [];

try {
  const s = JSON.parse(localStorage.getItem('as3_clean') || 'null');
  if (s) {
    CLIENTS.splice(0, CLIENTS.length, ...s.c);
    SERVICES.splice(0, SERVICES.length, ...s.s);
    if (s.p) PROS.splice(0, PROS.length, ...s.p);
    nid = Math.max(nid, ...CLIENTS.flatMap(c => c.visits.map(v => v.id + 1)));
  }
} catch(e) {}

const save = () => {
  try {
    localStorage.setItem('as3_clean', JSON.stringify({ c: CLIENTS, s: SERVICES, p: PROS }));
  } catch(e) {}
};
let nextId = 1;
const S=id=>SERVICES.find(s=>s.id===id);
const state={role:'admin',view:'agenda'};
const START=540,END=1200,HH=64; // 9:00–20:00, 64px por hora
const $=s=>document.querySelector(s);
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const eur=n=>n.toLocaleString('es-ES',{minimumFractionDigits:0})+' €';

/* ---------- Navegación ---------- */
const NAV=[
  {id:'agenda',label:'Agenda',icon:'📅'},
  {id:'clientes',label:'Clientes',icon:'👥'},
  {id:'servicios',label:'Servicios',icon:'✂️'},
  {id:'regalo',label:'Tarjetas Regalo',icon:'🎁'},
  {id:'caja',label:'Caja / Histórico',icon:'💶',admin:true},
  {id:'gestoria',label:'Gestoría',icon:'📑',admin:true},
  {id:'suscripcion',label:'Suscripción',icon:'⭐'},
  {id:'ayuda',label:'Ayuda y Guía',icon:'💡'},
  {id:'ajustes',label:'Ajustes',icon:'⚙️',admin:true}
];
function renderNav(){
  $('#nav').innerHTML=NAV.filter(n=>!n.admin||state.role==='admin').map(n=>
    `<button data-v="${n.id}" class="nav-btn w-full flex items-center gap-3 px-3 py-3 rounded-lg text-left text-[15px] hover:bg-gray-800 ${state.view===n.id?'active':''}"><span>${n.icon}</span>${n.label}</button>`).join('');
}
function go(v){state.cid=null;
  const n=NAV.find(x=>x.id===v);
  if(n.admin&&state.role!=='admin')v='agenda';
  state.view=v;
  $('#title').textContent=NAV.find(x=>x.id===v).label;
  renderNav();render();closeSide();
}
function setRole(r){
  state.role=r;
  document.querySelectorAll('.role-btn').forEach(b=>{
    const on=b.dataset.role===r;
    b.className='role-btn px-3 sm:px-4 py-1.5 rounded-full '+(on?'bg-[#111827] text-white shadow':'text-gray-600');
  });
  const n=NAV.find(x=>x.id===state.view);
  if(n.admin&&r!=='admin')state.view='agenda';
  go(state.view);
  toast(r==='admin'?'Vista Dueño/Admin':'Vista Empleado: Caja, Gestoría y precios ocultos');
}
const openSide=()=>{$('#side').classList.remove('-translate-x-full');$('#scrim').classList.remove('hidden')};
const closeSide=()=>{$('#side').classList.add('-translate-x-full');$('#scrim').classList.add('hidden')};

/* ---------- Vistas ---------- */
function render(){
  const v=state.view;
  $('#view').innerHTML=({agenda:vAgenda,clientes:vClientes,servicios:vServicios,regalo:vRegalo,caja:vCaja,gestoria:vGestoria,suscripcion:vSuscripcion,ayuda:vAyuda,ajustes:vAjustes})[v]();
}
function vAgenda(){if(!PROS.length)return emptyAgenda();if(state.apro&&!PROS.includes(state.apro))state.apro='';
  const d=aDay(),td=isToday(d),A=dayAppts(d),Bk=dayBlocks(d),adm=state.role==='admin';
  const hours=[];for(let m=START;m<END;m+=60)hours.push(m);
  const slots=[];for(let m=START;m<END;m+=30)slots.push(m);
  const H=(END-START)*HH/60,px=m=>(m-START)*HH/60;
  const cols=PROS.filter(p=>!state.apro||p===state.apro).map(p=>{

        <div class="w-14 shrink-0 sticky left-0 z-20 bg-white"><div class="h-12 border-b border-gray-200 sticky top-0 bg-white"></div><div class="relative" style="height:${H}px">${times}</div></div>
        ${cols}

}

const inp='w-full border border-gray-300 rounded-lg px-3 py-2.5 text-base bg-white';
const lbl='block text-sm font-medium text-gray-700 mb-1';
const timeOpts=(sel)=>{let o='';for(let m=START;m<=END;m+=15)o+=`<option value="${m}" ${m===sel?'selected':''}>${fmt(m)}</option>`;return o};
const proOpts=(all)=>(all?'<option value="all">Todos</option>':'')+(PROS.map(p=>`<option>${p}</option>`).join('')||'<option value="">—</option>');
function openModalBase(type,arg){
  const m=$('#modal'),b=$('#mBody');
  if(type==='appt'){
    const o=arg||{},d0=o.date&&o.date>=today()?o.date:aDay(),st0=o.start!=null?+o.start:600;
    $('#mTitle').textContent='Nueva cita';
    b.innerHTML=`<form id="f" class="space-y-3">
      <div class="rounded-lg bg-amber-50 border border-amber-200 text-[#8a6d12] text-sm px-3 py-2 capitalize">📅 ${longD(d0)} · ${fmt(st0)}</div>
      <div><label class="${lbl}">Cliente</label><input name="client" id="apClient" list="cl" required autocomplete="off" class="${inp}" placeholder="Nombre del cliente"><datalist id="cl">${CLIENTS.map(c=>`<option value="${esc(c.n)}">`).join('')}</datalist></div>
      <div><label class="${lbl}">Teléfono WhatsApp <span class="text-gray-400 font-normal">(para recordatorios)</span></label><input name="tel" id="apTel" type="tel" maxlength="20" class="${inp}" placeholder="Ej. 600 123 456"></div>
      <div><label class="${lbl}">Servicio</label><select name="svc" class="${inp}">${SERVICES.map(s=>`<option value="${s.id}">${esc(s.name)} · ${s.dur} min</option>`).join('')}</select></div>
      <div><label class="${lbl}">Profesional</label><select name="pro" class="${inp}">${PROS.map(p=>`<option ${p===o.pro?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
      <div class="grid grid-cols-2 gap-3"><div><label class="${lbl}">Día</label><input name="date" type="date" required min="${today()}" value="${d0}" class="${inp}"></div>
      <div><label class="${lbl}">Hora</label><select name="start" class="${inp}">${timeOpts(st0)}</select></div></div>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="gift" class="w-5 h-5 accent-[#D4AF37]"> Cita a 0 € / pagada con Tarjeta Regalo</label>
      <button class="w-full py-3 rounded-lg bg-[#111827] text-white font-medium">Guardar cita</button></form>`;
    $('#apClient').oninput=e=>{const c=CLIENTS.find(x=>norm(x.n)===norm(e.target.value.trim()));if(c&&!$('#apTel').value)$('#apTel').value=c.t};
    $('#f').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),svc=S(f.get('svc')),start=+f.get('start'),d=f.get('date'),pro=f.get('pro');
      if(!d||d<today())return toast('Elige hoy o un día posterior');
      if(start+svc.dur>END){toast('La cita termina después del cierre');return}
      const clash=[...dayAppts(d),...dayBlocks(d)].some(x=>x.pro===pro&&start<x.start+x.dur&&x.start<start+svc.dur);
      if(clash&&!confirm('Ese hueco ya está ocupado. ¿Crear la cita igualmente?'))return;
      const gift=!!f.get('gift'),client=clean(f.get('client')),tel=cleanTel(f.get('tel'));
      if(isToday(d)){
        if(gift&&zeroLeft()<=0)return toast('Cupo diario de citas a 0 € completo');
        appts.push({id:nextId++,pro,start,dur:svc.dur,client,tel,svc:svc.id,gift,estado:'confirmada',origen:'centro'});saveDay();
      }else{const q=futQ();q.push({rid:newRid(),date:d,pro,start,dur:svc.dur,client,tel,svc:svc.id,gift,estado:'confirmada',origen:'centro'});futSave(q)}
      state.aday=d;closeModal();render();toast('Cita creada · '+fmt(start)+(isToday(d)?'':' · '+new Date(d+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'})));};
  }else{
    $('#mTitle').textContent='Bloquear horario';
    b.innerHTML=`<form id="f" class="space-y-3">
      <div><label class="${lbl}">Profesional</label><select name="pro" class="${inp}">${proOpts(true)}</select></div>
      <div class="grid grid-cols-2 gap-3"><div><label class="${lbl}">Desde</label><select name="a" class="${inp}">${timeOpts(840)}</select></div>
      <div><label class="${lbl}">Hasta</label><select name="b" class="${inp}">${timeOpts(900)}</select></div></div>
      <div><label class="${lbl}">Motivo</label><select name="label" class="${inp}"><option>Comida</option><option>Descanso</option><option>Formación</option><option>Gestión</option></select></div>
      <button class="w-full py-3 rounded-lg bg-[#111827] text-white font-medium">Bloquear</button></form>`;
    $('#f').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),a=+f.get('a'),z=+f.get('b');
      if(z<=a){toast('La hora final debe ser posterior');return}
      (f.get('pro')==='all'?PROS:[f.get('pro')]).forEach(p=>blocks.push({pro:p,start:a,dur:z-a,label:f.get('label')}));
      saveDay();closeModal();render();toast('Horario bloqueado');};
  }
  m.classList.remove('hidden');m.classList.add('flex');
}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').classList.remove('flex')}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(tt);tt=setTimeout(()=>e.classList.add('hidden'),2400)}

const clean=s=>String(s).replace(/[<>&"]/g,'').trim();

function initSig(){
  const cv=$('#sig'),r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap=x.lineJoin='round';x.strokeStyle='#111827';
  let on=false;
  const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{e.preventDefault();on=true;cv.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke();cv.dataset.d=1};
  cv.onpointermove=e=>{if(!on)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke();x.beginPath();x.moveTo(a,b)};
  cv.onpointerup=cv.onpointercancel=()=>{on=false};

}

function waPhone(t){let d=String(t||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===9)d='34'+d;return d.length>=10?d:''}

function apptByKey(k){const[t,v]=[k.slice(0,1),k.slice(2)];

function sendWa(k){

  if(url){window.open(url,'_blank','noopener');patchByKey(k,{rem:Date.now(),tel:cleanTel(tel)});if($('#modal').classList.contains('hidden'))render();return}
  /* Sin teléfono: pedirlo, guardarlo en la cita y abrir WhatsApp */
  showModal('📲 Recordatorio por WhatsApp',`<form id="fwa" class="space-y-3"><p class="text-sm text-gray-600"><b>${esc(r.a.client)}</b> no tiene teléfono guardado. Escríbelo para enviarle el recordatorio.</p>
    <div><label class="${lbl}">Teléfono WhatsApp</label><input name="tel" type="tel" required maxlength="20" placeholder="Ej. 600 123 456" class="${inp}"></div>
    <div class="text-xs bg-gray-50 border border-gray-200 rounded-lg p-3 text-gray-600">${esc(waText(r.a,r.d))}</div>
    <button class="w-full py-3 rounded-lg bg-[#25D366] text-white font-semibold">Abrir WhatsApp</button></form>`);
  $('#fwa').onsubmit=e=>{e.preventDefault();const t=cleanTel(new FormData(e.target).get('tel')),u=waLink(t,waText(r.a,r.d));
    if(!u)return toast('Teléfono no válido');window.open(u,'_blank','noopener');patchByKey(k,{tel:t,rem:Date.now()});closeModal();render()};
}
/* Botón global: citas de mañana, una a una con 1 clic */

  const d=tomorrow(),L=futQ().filter(x=>x.date===d).sort((a,b)=>a.start-b.start),sent=L.filter(x=>x.rem).length;
  const row=a=>{const s=S(a.svc),tel=telOf(a),u=waLink(tel,waText(a,d));
    return `<div class="flex items-center gap-3 py-3 border-t first:border-0"><i class="w-1.5 h-10 rounded shrink-0" style="background:${s?s.color:'#475569'}"></i>
      <div class="flex-1 min-w-0"><div class="font-medium truncate">${esc(a.client)} ${a.rem?'<span class="text-xs text-green-700">✓ enviado</span>':''}</div><div class="text-xs text-gray-500 truncate">${fmt(a.start)} · ${esc(s?s.name:'Servicio')} · ${esc(a.pro)}${tel?' · '+esc(tel):''}</div></div>
      ${u?`<a href="${u}" target="_blank" rel="noopener" data-rem="f:${esc(a.rid)}" class="shrink-0 px-3 py-2 rounded-lg ${a.rem?'border border-[#25D366] text-[#128C7E] bg-white':'bg-[#25D366] text-white'} text-sm font-semibold">${a.rem?'Reenviar':'📲 Enviar'}</a>`
        :`<button data-a="editFut" data-id="${esc(a.rid)}" class="shrink-0 px-3 py-2 rounded-lg border border-gray-300 text-sm">＋ Teléfono</button>`}</div>`};
  showModal('📲 Recordar citas de mañana',`<div class="text-sm text-gray-500 capitalize mb-1">${longD(d)}</div>
    <div class="text-sm mb-3">${L.length?`<b>${L.length}</b> cita(s) · <span class="text-green-700">${sent} enviada(s)</span>`:''}</div>
    ${L.length?`<div id="remList">${L.map(row).join('')}</div><p class="text-xs text-gray-400 mt-3">Cada botón abre WhatsApp con el mensaje ya redactado para ese cliente. Solo tienes que pulsar «Enviar» en WhatsApp.</p>`
      :'<div class="text-center py-8"><div class="text-4xl mb-2">🗓️</div><p class="text-sm text-gray-500">No hay citas para mañana.</p></div>'}`);

   <div><label class="${lbl}">Teléfono WhatsApp</label><input name="tel" type="tel" maxlength="20" value="${esc(telOf(a))}" class="${inp}"></div>
   <div><label class="${lbl}">Servicio</label><select name="svc" class="${inp}">${SERVICES.map(s=>`<option value="${s.id}" ${s.id===a.svc?'selected':''}>${esc(s.name)} · ${s.dur} min</option>`).join('')}</select></div>
   <div><label class="${lbl}">Profesional</label><select name="pro" class="${inp}">${PROS.map(p=>`<option ${p===a.pro?'selected':''}>${esc(p)}</option>`).join('')}</select></div>

   ${a.estado==='pendiente'?`<label class="flex items-center gap-2 text-sm"><input type="checkbox" name="conf" checked class="w-5 h-5 accent-[#D4AF37]"> Confirmar cita (quitar «pendiente»)</label>`:''}
   <button class="${sbtn}">Guardar cambios</button>
   <button type="button" id="apWa" class="w-full py-3 rounded-lg bg-[#25D366] text-white font-semibold">📲 Enviar recordatorio por WhatsApp</button>
   <button type="button" id="apDel" class="w-full py-2.5 text-sm text-red-600">Eliminar cita</button></form>`);
  $('#f').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),s=S(f.get('svc')),start=+f.get('start'),pro=f.get('pro'),d=f.get('date');
    if(!d||d<today())return toast('Elige hoy o un día posterior');
    if(start+s.dur>END)return toast('La cita termina después del cierre');
    const others=isToday(d)?[...appts,...blocks]:futQ().filter(x=>x.date===d&&x.rid!==rid);
    if(others.some(x=>x.pro===pro&&start<x.start+x.dur&&x.start<start+s.dur)&&!confirm('Ese hueco ya está ocupado. ¿Guardar igualmente?'))return;
    const q2=futQ(),i=q2.findIndex(x=>x.rid===rid);if(i<0)return closeModal();
    const o={...q2[i],client:clean(f.get('client')),tel:cleanTel(f.get('tel')),svc:s.id,dur:s.dur,pro,start,date:d};if(o.estado==='pendiente'&&f.get('conf'))o.estado='confirmada';
    if(isToday(d)){q2.splice(i,1);futSave(q2);const{date,...rest}=o;appts.push({...rest,id:nextId++,gift:!!o.gift});saveDay()}
    else{q2[i]=o;futSave(q2)}
    state.aday=d;closeModal();render();toast('Cita actualizada')};
  $('#apWa').onclick=()=>{const t=cleanTel($('#f').tel.value);if(t)patchByKey('f:'+rid,{tel:t});closeModal();sendWa('f:'+rid)};
  $('#apDel').onclick=()=>{if(confirm('¿Eliminar esta cita?')){futSave(futQ().filter(x=>x.rid!==rid));closeModal();render();toast('Cita eliminada')}};
}
document.addEventListener('click',e=>{
  const w=e.target.closest('[data-wa]');if(w){sendWa(w.dataset.wa);return}
  const r=e.target.closest('[data-rem]');if(r){const k=r.dataset.rem;setTimeout(()=>{patchByKey(k,{rem:Date.now()});remindModal()},50);return}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
  if(a==='slot')openModal('appt',{date:aDay(),pro:t.dataset.pro,start:+t.dataset.m});
  else if(a==='newApptDay')openModal('appt',{date:aDay()});
  else if(a==='editFut')editFutModal(id);
  else if(a==='aday'){const n=addDays(aDay(),+id);state.aday=n<today()?today():n;render()}
  else if(a==='atoday'){state.aday=today();render()}
  else if(a==='remind')remindModal();
});

  return [...a,...q].sort((p,r)=>p.t.localeCompare(r.t));

function forecast(){
  const t=new Date();t.setDate(t.getDate()+1);
  const past=ALL().filter(c=>new Date(c.d+'T12:00').getDay()===t.getDay()).slice(0,8);
  if(!past.length)return null;
  const av=k=>past.reduce((s,c)=>s+c[k],0)/past.length;
  return{n:Math.round(av('n')),total:r2(av('total')),tk:r2(av('total')/av('n')),min:Math.min(...past.map(c=>c.total)),max:Math.max(...past.map(c=>c.total)),k:past.length};
}

/* --- Gestoría --- */
const mon=gm=>{const rows=ALL().filter(c=>c.d.startsWith(gm)).sort((a,b)=>a.d.localeCompare(b.d)).map(c=>({...c,b:r2(c.total/1.21),iva:r2(c.total-r2(c.total/1.21))}));return{rows,T:k=>r2(rows.reduce((s,c)=>s+c[k],0))}};
function csv(gm){
  const{rows,T}=mon(gm),f=n=>n.toFixed(2).replace('.',',');
  const L=[['Fecha','Efectivo','Tarjeta','Bizum','Total facturado','Base imponible','IVA 21%','Citas a 0 EUR','Tickets','Descuadre caja']];
  rows.forEach(c=>L.push([c.d,f(c.cash),f(c.card),f(c.bizum),f(c.total),f(c.b),f(c.iva),c.zero,c.n,f(c.diff)]));
  L.push(['TOTAL',f(T('cash')),f(T('card')),f(T('bizum')),f(T('total')),f(T('b')),f(T('iva')),T('zero'),T('n'),f(T('diff'))]);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.map(r=>r.join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download=`AgendaSavia_facturacion_${gm}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('Descargando '+a.download);
}

   'Para <b>cancelar</b>, pulsa <b>«Eliminar cita»</b> y confirma.',
   'Para avisar al cliente del cambio, usa el botón de WhatsApp de la cita: abre WhatsApp con el mensaje preparado.'],
   tip:'Las citas ya <b>cobradas</b> no se pueden modificar. Usa las flechas ‹ › o el calendario de la parte superior para ver y crear citas de otros días; el TPV y la caja trabajan siempre con el día en curso.'},
  {q:'Colores por tipo de servicio',s:[
   'Entra en <b>Servicios</b> (el cambio de colores es solo para el Dueño).',
   'Pulsa <b>«Editar»</b> en el servicio que quieras.',
   'En <b>«Color en la agenda»</b> elige una muestra o usa el selector para un color propio.',
   'Pulsa <b>«Guardar servicio»</b>: todas las citas de ese servicio cambian al instante.',
   'Encima de la agenda pulsa <b>«✂️ Ver catálogo de servicios»</b> para desplegar la leyenda con cada color. El borde dorado indica una cita a 0 € / regalo.'],
   tip:'Usa un color distinto por familia de servicio (corte, color, manos…) y evita tonos parecidos: a primera vista tienes que distinguirlos en el móvil.'},
  {q:'Bloques de descanso o almuerzo',s:[
   'En Agenda pulsa <b>«⏸ Bloquear horario»</b>.',
   'Elige el <b>profesional</b> o <b>«Todos»</b> si es un cierre general (comida del equipo, formación).',
   'Indica <b>Desde</b> y <b>Hasta</b> (la hora final debe ser posterior a la inicial) y el <b>motivo</b>: Comida, Descanso, Formación o Gestión.',
   'Pulsa <b>«Bloquear»</b>: aparece una franja rayada gris en la columna.',
   'Para quitarlo, <b>toca la franja rayada</b> y confirma.'],
   tip:'El bloqueo avisa, pero no es una barrera dura: si alguien intenta crear una cita encima, la app pide confirmación y, si aceptas, la crea igualmente. Pulsa «Cancelar» para respetar el bloqueo.'},
  {q:'Vista por profesional vs. vista general',s:[
   '<b>Vista general:</b> es la que ves por defecto. Todas las columnas (una por profesional) se muestran lado a lado. En el móvil desliza horizontalmente.',
   '<b>Vista por profesional:</b> en la barra superior de la agenda abre el selector <b>«Ver:»</b> y elige un nombre. Solo verás su columna.',
   'Para volver, elige <b>«Todos (vista general)»</b>.',
   'Recomendación: usa la general para repartir citas y detectar huecos; usa la individual para enseñarle a cada profesional su día en el móvil.'],
   tip:'Cambiar de vista no modifica ninguna cita, solo filtra lo que ves.'}
 ]},
 {id:'crm',i:'👤',c:'👤 CRM y fichas',t:'2. CRM y Fichas de Clientes',g:'clientes',arts:[
  {q:'Dar de alta un cliente y consultar su historial',s:[
   'Ve a <b>Clientes</b> y pulsa <b>«＋ Cliente»</b>.',
   'Escribe <b>nombre</b> y <b>teléfono</b> y pulsa «Crear cliente».',
   'Para buscarlo, escribe en el buscador parte del nombre o del teléfono; filtra al instante y no distingue tildes.',
   'Toca al cliente para abrir su <b>ficha</b>. Tiene tres pestañas: <b>Visitas</b>, <b>Compras</b> y <b>Consentimientos</b>.',
   'En Visitas verás cada servicio con fecha, profesional e importe, de la más reciente a la más antigua. El Dueño ve además el <b>gasto total</b>.',
   'Para añadir una visita pulsa <b>«＋ Registrar visita»</b>, elige servicio, profesional y fecha, y guarda.'],
   tip:'Registrar una visita es manual y es independiente de la cita de la agenda. Hazlo al terminar el servicio para que el historial esté completo.'},
  {q:'Notas técnicas: fórmulas de tinte, alergias y observaciones',s:[
   'Abre la ficha del cliente y, en una visita, localiza la fila para añadir notas (si no hay visita, crea una con «＋ Registrar visita»).',
   'Elige el <b>tipo de nota</b>: Fórmula, Piel, Alergia, Sensibilidad o General.',
   'Escribe el texto (por ejemplo «6.3 + 7.1, oxidante 20 vol, 35 min») y pulsa <b>«Añadir nota»</b>. Se guarda con fecha y hora.',
   'Las notas de tipo <b>Alergia</b> activan un aviso rojo ⚠ en la ficha y la etiqueta «ALERGIA» en la lista de clientes.',
   'Para borrar una nota usa la ✕ junto a ella.'],
   tip:'Escribe cada alergia en una nota independiente y con el nombre exacto del producto o principio activo; así el aviso rojo es claro de un vistazo.'},
  {q:'Consentimiento informado RGPD con firma en pantalla',s:[
   'Abre la ficha del cliente → pestaña <b>Consentimientos</b> → <b>«✍ Nuevo consentimiento»</b>.',
   'Elige el <b>tratamiento</b> (Láser, Peeling químico o Micropigmentación). Debajo aparece el texto que se va a aceptar.',
   'Entrega el dispositivo al cliente para que lo lea y marque las <b>tres declaraciones</b> (salud y alergias, aceptación de riesgos, tratamiento de datos RGPD).',
   'Comprueba el <b>nombre del firmante</b> (viene relleno con el del cliente; cámbialo si firma un tutor).',
   'El cliente <b>firma con el dedo</b> (móvil o tablet) o con ratón o lápiz táctil dentro del recuadro punteado. Si se equivoca, pulsa <b>«Borrar firma»</b> y repite.',
   'Pulsa <b>«Firmar y guardar»</b>. La app no deja guardar si falta alguna declaración o la firma.',
   '<b>Cómo queda guardado:</b> en la pestaña Consentimientos aparece una tarjeta con tratamiento, nombre del firmante, fecha y hora, la imagen de la firma y el texto aceptado («Ver texto aceptado»). Se almacena en el navegador de este dispositivo y no se puede editar después.'],
   tip:'Gira la tablet en horizontal para que la firma sea más cómoda. Como son datos de salud, descarga una copia de seguridad con regularidad (Ajustes → Copia de seguridad).'}
 ]},
 {id:'caja',i:'💶',c:'💶 TPV y caja',t:'3. TPV, Arqueo y Cierre de Caja',g:'caja',arts:[
  {q:'Cobrar una cita: efectivo, tarjeta o Bizum',s:[
   'Entra en <b>Caja → TPV</b> (la sección Caja es solo para el Dueño). En «Pendientes de cobro» están las citas de hoy sin cobrar.',
   'Pulsa <b>«Cobrar»</b> en la cita correspondiente.',
   'Elige el método: <b>💶 Efectivo</b>, <b>💳 Tarjeta</b> o <b>📲 Bizum</b>. «Canje 0€» es para citas de regalo o cortesía; si hay una tarjeta regalo con saldo suficiente, selecciónala en el desplegable <i>antes</i> de pulsar «Canje 0€».',
   'El cobro aparece en <b>«Cobros de hoy»</b> y suma en los totales de la parte superior.',
   'Para vender algo sin cita (producto, extra) usa <b>«Venta rápida»</b>: concepto, importe, método y «Cobrar».'],
   tip:'Elige siempre el método real. Si registras como «Efectivo» un pago con tarjeta, el cajón no cuadrará al final del día. Una cita cobrada no se puede editar.'},
  {q:'Arqueo físico: contar billetes y monedas y saber si cuadra',s:[
   'Ve a <b>Caja → «Arqueo y cierre»</b>.',
   'Revisa el <b>«Fondo de caja inicial»</b>: el dinero que había en el cajón al abrir (por defecto 100 €). Debe ser exacto.',
   'Cuenta el cajón y escribe, en cada casilla, <b>cuántas piezas</b> tienes (no el importe): billetes de 50, 20, 10 y 5 €, y monedas de 2 €, 1 €, 0,50, 0,20, 0,10 y 0,05.',
   'La app calcula sola: <b>Esperado</b> = fondo inicial + cobros en efectivo de hoy · <b>Contado</b> = suma de lo que has introducido · <b>Descuadre</b> = Contado − Esperado.',
   'Interpreta el resultado: <b style="color:#15803d">verde «Cuadra exacto»</b> (0 €), <b style="color:#b45309">ámbar «sobrante»</b> (hay más dinero del esperado) o <b style="color:#b91c1c">rojo «faltante»</b> (falta dinero).',
   '<b>Ejemplo:</b> fondo 100 € + efectivo cobrado 85 € = esperado 185 €. Si cuentas 180 €, aparece «faltante 5,00 €».'],
   tip:'Cuenta dos veces y no incluyas tarjeta ni Bizum: solo el efectivo físico. La app solo tiene casillas hasta 50 €; si tienes billetes mayores, regístralos como su equivalente en billetes de 50 €.'},
  {q:'Cierre de caja diario definitivo',s:[
   'Antes de cerrar, revisa en TPV que no queden <b>pendientes de cobro</b>.',
   'Completa el arqueo físico (es obligatorio: si el recuento es 0 la app no deja cerrar).',
   'Pulsa <b>«🔒 Cerrar caja del día»</b> y confirma el aviso.',
   'Se guarda el cierre con totales por método, nº de tickets, citas a 0 €, importe esperado y descuadre. Los cobros quedan <b>bloqueados hasta mañana</b>, y no se puede reabrir la caja.',
   'Consulta cierres anteriores en <b>Caja → Histórico</b> (por fecha o por mes). La pestaña <b>Previsión</b> usa ese histórico para estimar el día siguiente.'],
   tip:'Cierra una sola vez, al final de la jornada y con todo cobrado. Los cierres alimentan la Gestoría: un día sin cierre no aparece en el informe.'}
 ]},
 {id:'gestoria',i:'📊',c:'📊 Gestoría',t:'4. Gestoría y Facturación',g:'gestoria',arts:[
  {q:'Consultar el desglose de ingresos por periodo',s:[
   'Entra en <b>Gestoría</b> (solo Dueño).',
   'En <b>«Mes a exportar»</b> elige el mes (últimos 12; por defecto el mes anterior).',
   'Revisa las cifras: <b>Facturación total</b>, <b>Base imponible</b>, <b>IVA 21 %</b> y <b>Días con cierre</b>.',
   'La tabla inferior desglosa cada día en efectivo, tarjeta, Bizum y total.',
   'Para ver el detalle de un día concreto (tickets, descuadre, citas a 0 €) ve a <b>Caja → Histórico</b>.'],
   tip:'Solo cuentan los días con <b>caja cerrada</b>. Los importes incluyen IVA y la base se calcula como total ÷ 1,21.'},
  {q:'Exportar el informe CSV para tu gestor o contable',s:[
   'En Gestoría elige el <b>mes</b>.',
   'Pulsa <b>«⬇ Descargar CSV para la gestoría»</b>: se descarga <i>AgendaSavia_facturacion_AAAA-MM.csv</i>.',
   'El archivo usa «;» como separador y coma decimal, así que se abre directamente en Excel. Incluye por día: efectivo, tarjeta, Bizum, total, base, IVA, citas a 0 €, tickets y descuadre, más una fila TOTAL.',
   'Envíalo por correo a tu gestor. Si prefieres papel o PDF, usa <b>«🖨 Imprimir»</b>.'],
   tip:'Es un informe de control interno, no una factura con validez fiscal (consulta el Aviso Legal). Pide a tu gestor que valide las cifras.'}
 ]},
 {id:'whatsapp',i:'📲',c:'📲 WhatsApp',t:'5. Recordatorios por WhatsApp',g:'agenda',arts:[
  {q:'Recordar las citas de mañana con 1 clic',s:[
   'En <b>Agenda</b> pulsa el botón verde <b>«📲 Recordar citas de mañana»</b>. El número indica cuántas citas hay mañana.',
   'Se abre la lista de citas del día siguiente, ordenadas por hora.',
   'Pulsa <b>«📲 Enviar»</b> en cada cliente: se abre WhatsApp con el mensaje ya redactado («¡Hola…! Te recordamos tu cita para… mañana a las…»). Solo tienes que pulsar enviar en WhatsApp.',
   'Al volver, la cita queda marcada como <b>✓ enviado</b> para que no repitas el aviso.',
   'Si un cliente no tiene teléfono, pulsa <b>«＋ Teléfono»</b>, guárdalo y envía.'],
   tip:'Guarda el teléfono al crear la cita (campo «Teléfono WhatsApp»). Si el cliente está dado de alta en <b>Clientes</b>, su teléfono se rellena solo.'},
  {q:'Enviar un recordatorio desde una cita concreta',s:[
   'Cada cita de la agenda tiene un botón redondo de <b>WhatsApp</b>. Púlsalo para abrir el mensaje de recordatorio de esa cita.',
   'También puedes abrir la cita y pulsar <b>«📲 Enviar recordatorio por WhatsApp»</b>.',
   'El mensaje dice «hoy», «mañana» o el día concreto según la fecha de la cita.'],
   tip:'Los números españoles de 9 cifras se envían con el prefijo +34 automáticamente. Para otros países escribe el prefijo internacional.'}
 ]},
 {id:'faq',i:'🛠️',c:'🛠️ Errores y FAQ',t:'6. Guía Anti-Errores y Preguntas Frecuentes',g:null,arts:[
  {q:'¿Qué hago si la caja no cuadra al final del día?',s:[
   'Anota el descuadre que muestra el arqueo (faltante o sobrante) y no cierres todavía.',
   'Revisa <b>Caja → TPV → «Pendientes de cobro»</b>: una cita sin cobrar o cobrada con el método equivocado (tarjeta registrada como efectivo, o al revés) es la causa más habitual.',
   'Repasa <b>«Cobros de hoy»</b> ticket a ticket y comprueba el método de cada uno.',
   'Verifica el <b>fondo de caja inicial</b>: debe ser lo que de verdad había en el cajón al abrir. Corrígelo y el resultado se recalcula al instante.',
   'Vuelve a contar billetes y monedas; revisa que no haya un dígito mal escrito en alguna casilla.',
   'Si <b>sobra</b> dinero: ¿cobraste algo en efectivo sin registrarlo? Anótalo en «Venta rápida». Si <b>falta</b>: ¿pagaste a un proveedor, diste un cambio erróneo o sacaste una propina del cajón?',
   'Si no encuentras la causa, cierra igualmente: la diferencia queda anotada en el Histórico y tu gestor podrá verla.'],
   tip:'Haz el arqueo todas las noches, aunque cuadre: así los errores se detectan el mismo día, cuando todavía los recuerdas.'},
  {q:'¿Cómo soluciono un solapamiento accidental de citas?',s:[
   'Localiza las dos citas superpuestas en la misma columna.',
   'Toca una de ellas y cámbiala a otra <b>hora</b> o a otro <b>profesional</b> libre; la app te avisa si el nuevo hueco también está ocupado.',
   'Si una de ellas fue un error, pulsa <b>«Eliminar cita»</b>.',
   'Avisa al cliente afectado con el botón de WhatsApp de su cita.',
   'Para evitarlo: usa «Bloquear horario» para descansos y no aceptes el aviso «Ese hueco ya está ocupado» salvo que sea intencionado.'],
   tip:'Usa la vista por profesional para revisar con calma la columna afectada.'},
  {q:'¿Qué hago si un cliente no quiere o no puede firmar en pantalla?',s:[
   '<b>No realices el tratamiento</b> (láser, peeling, micropigmentación) sin consentimiento firmado. La app tampoco permite guardarlo sin firma.',
   'Explícale de nuevo los riesgos con calma y deja que lea el texto completo.',
   'Si le cuesta firmar con el dedo, ofrécele un <b>lápiz táctil</b>, un ratón o girar el dispositivo en horizontal. «Borrar firma» permite repetirla.',
   'Si no puede firmar por sí mismo (por ejemplo, menor de edad), firma su madre, padre o tutor: escribe su nombre en «Nombre del firmante».',
   'Si se niega, anótalo en su ficha como nota <b>General</b> y no continúes con el tratamiento.']},
  {q:'El navegador va lento o hay un problema de caché: refrescar datos y copia de seguridad',s:[
   '<b>Recarga primero:</b> en <b>Ajustes → «🔄 Recargar aplicación»</b> (o recarga la pestaña). No borra tus datos.',
   '<b>Haz una copia de seguridad:</b> <b>Ajustes → Copia de seguridad → «⬇ Descargar copia»</b>. Se guarda un archivo .json con clientes, servicios, citas, cajas y consentimientos.',
   'Cierra otras pestañas pesadas y limpia la <b>caché</b> del navegador. <b>No marques «cookies y datos del sitio»</b>: eso borraría tu información.',
   'Los datos se guardan en el navegador, con un límite aproximado de 5 MB. Muchas firmas de consentimiento ocupan espacio: si la app deja de guardar, descarga la copia y escribe a soporte.',
   '<b>Restaurar:</b> <b>Ajustes → «⬆ Restaurar copia»</b> y selecciona el archivo .json. Sustituye los datos actuales y reinicia la app.',
   'No uses el modo incógnito: al cerrar la ventana se pierden los datos.'],
   tip:'Haz una copia semanal y guarda el archivo fuera del dispositivo (Drive, iCloud o tu correo).'},
  {q:'Cerrar sesión, contraseña olvidada y cuenta en otro dispositivo',s:[
   'Para <b>cerrar sesión</b> pulsa «⎋ Cerrar sesión» al final del menú lateral. Volverás a la portada.',
   'Para <b>volver a entrar</b> pulsa «Ya estoy suscrito» e introduce tu usuario o correo y tu contraseña.',
   'Tu cuenta se guarda en la nube y la contraseña se almacena cifrada. Si la olvidas, pulsa <b>«¿Olvidaste tu contraseña?»</b> e introduce el PIN o la respuesta que definiste al registrarte.',
   'Puedes entrar desde otro móvil u ordenador con tu usuario y contraseña: tus datos se sincronizan. Sin conexión la app sigue funcionando con la copia de este dispositivo y sube los cambios al volver internet.',
   'Tras 5 intentos fallidos, el acceso se bloquea 30 segundos.'],
   tip:'Descarga una copia de seguridad con regularidad y guarda tu usuario y contraseña en un gestor de contraseñas.'},
  {q:'Soporte directo: incidencias que no se resuelven con esta guía',s:[
   'Prueba primero con el <b>buscador</b> de este Centro de Ayuda.',
   'Si no encuentras solución, escribe a <b>websize130@gmail.com</b> o usa el botón <b>«🛟 Reportar un problema»</b> del pie de página (abre tu correo con el mensaje preparado).',
   'Cuéntanos qué ocurrió, los pasos que seguiste, la sección y el dispositivo. <b>No incluyas datos personales ni de salud de tus clientes.</b>']}
 ]}
];
const mTxt=(m,a)=>norm([m.t,a.q,...a.s,a.tip||''].join(' ').replace(/<[^>]*>/g,' '));
function helpArt(a,open){return `<details class="bg-white rounded-xl border border-gray-200 p-4" ${open?'open':''}><summary class="font-medium cursor-pointer">${a.q}</summary><ol class="mt-3 space-y-2.5">${a.s.map((x,i)=>`<li class="flex gap-3"><span class="shrink-0 w-6 h-6 rounded-full bg-[#111827] text-white text-xs grid place-items-center font-semibold">${i+1}</span><span class="text-sm text-gray-700 leading-relaxed">${x}</span></li>`).join('')}</ol>${a.tip?`<div class="mt-3 text-sm rounded-lg bg-amber-50 border border-amber-200 text-[#8a6d12] p-3">💡 <b>Consejo:</b> ${a.tip}</div>`:''}</details>`}
function helpBody(){
  const q=norm((state.hq||'').trim()),adm=state.role==='admin';
  if(q){
    const words=q.split(/\s+/).filter(Boolean);
    const hits=MODS.map(m=>({m,a:m.arts.filter(a=>{const t=mTxt(m,a);return words.every(w=>t.includes(w))})})).filter(x=>x.a.length);
    return hits.length?`<p class="text-sm text-gray-500 mb-3">${hits.reduce((n,x)=>n+x.a.length,0)} resultado(s)</p>`+hits.map(x=>`<div class="mb-4"><div class="text-xs font-semibold uppercase tracking-wide text-gray-500 mb-2">${x.m.i} ${x.m.t}</div><div class="space-y-3">${x.a.map(a=>helpArt(a,hits.length===1&&x.a.length===1)).join('')}</div></div>`).join(''):`<div class="bg-white rounded-xl border border-gray-200 p-5 text-sm text-gray-600">No hay resultados para «${esc(state.hq)}». Prueba con otra palabra (por ejemplo «caja», «firma», «cita», «QR») o escribe a <a class="underline font-medium text-[#8a6d12]" href="mailto:${MAIL}">${MAIL}</a>.</div>`;
  }
  const t=state.htab&&MODS.some(m=>m.id===state.htab)?state.htab:'agenda',m=MODS.find(x=>x.id===t),nv=m.g&&NAV.find(n=>n.id===m.g);
  return `<div class="text-xs font-semibold uppercase tracking-wide text-gray-500 mb-2">${m.i} ${m.t}</div><div class="space-y-3">${m.arts.map((a,i)=>helpArt(a,i===0)).join('')}</div>${nv&&(!nv.admin||adm)?`<button data-v="${m.g}" class="${btn} mt-4">Ir a ${nv.label} →</button>`:nv?'<p class="text-xs text-gray-400 mt-4">🔒 Esta sección solo está disponible para el Dueño/Admin.</p>':''}`;
}
function vAyuda(){
  const t=state.htab||'agenda',has=!!(state.hq||'').trim();
  const chips=MODS.map(m=>`<button data-a="htab" data-id="${m.id}" class="px-3 py-2 rounded-full text-sm whitespace-nowrap ${!has&&t===m.id?'bg-[#111827] text-white':'bg-white border border-gray-300 text-gray-600'}">${m.c}</button>`).join('');
  return `<div class="rounded-2xl bg-[#111827] text-white p-5 mb-4"><div class="text-lg font-bold">Centro de Ayuda</div><p class="text-sm text-gray-300 mt-1">Manual paso a paso de todas las funciones. Busca por palabra o elige un módulo.</p><input id="hq" type="search" autocomplete="off" value="${esc(state.hq||'')}" placeholder="🔍 Buscar: cobrar, firma, QR, caja no cuadra…" class="${inp} mt-3 text-gray-900"></div>
  <div id="hchips" class="flex gap-2 overflow-x-auto pb-2 mb-3">${chips}</div>
  <p class="text-xs text-gray-400 mb-3">Las secciones Caja, Gestoría y Ajustes solo aparecen en la vista Dueño/Admin.</p>
  <div id="hres">${helpBody()}</div>${supportCard()}`;
}
document.addEventListener('input',e=>{if(e.target.id!=='hq')return;state.hq=e.target.value;$('#hres').innerHTML=helpBody();
  $('#hchips').querySelectorAll('[data-a="htab"]').forEach(b=>{const on=!state.hq.trim()&&b.dataset.id===(state.htab||'agenda');b.className='px-3 py-2 rounded-full text-sm whitespace-nowrap '+(on?'bg-[#111827] text-white':'bg-white border border-gray-300 text-gray-600')})});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a="htab"]');if(t)state.hq=''});


/* --- WhatsApp del centro (Ajustes) y mantenimiento --- */
function savePhone(){const v=cleanTel($('#ph').value),l=asAcc(),a=l.find(x=>x.slug===window.AS_SLUG);if(!a)return;a.phone=v;asSave(l);window.asPushAccount&&asPushAccount();render();toast('Teléfono guardado')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a==='phSave')savePhone();
  else if(a==='backup')backup();
  else if(a==='restore')$('#rfile').click();
  else if(a==='reloadApp')location.reload();
});

/* --- Copia de seguridad --- */
const backupCard=()=>card(`<div class="font-semibold mb-1">Copia de seguridad y mantenimiento</div><p class="text-sm text-gray-500 mb-3">Descarga un archivo con todos tus datos (clientes, citas, cajas, consentimientos…) o restáuralo. Útil antes de limpiar el navegador o cambiar de dispositivo.</p>
 <div class="flex flex-wrap gap-2"><button data-a="backup" class="${btn}">⬇ Descargar copia</button><button data-a="restore" class="px-4 py-2.5 rounded-lg border border-gray-300 bg-white text-sm font-medium">⬆ Restaurar copia</button><button data-a="reloadApp" class="px-4 py-2.5 rounded-lg border border-gray-300 bg-white text-sm font-medium">🔄 Recargar aplicación</button></div><input id="rfile" type="file" accept=".json,application/json" class="hidden">`,'mb-4');
function backup(){
  const o={app:'AgendaSavia',v:1,ts:new Date().toISOString(),data:{}};
  try{asKeys().forEach(k=>o.data[k]=localStorage.getItem(k))}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));
  a.download='AgendaSavia_copia_'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Copia descargada');
}
document.addEventListener('change',e=>{if(e.target.id!=='rfile')return;const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);
    if(o.app!=='AgendaSavia'||!o.data)throw 0;
    const ks=Object.keys(o.data).filter(k=>/^as3_clean(_ops|_day|_future|_center)?$/.test(k));if(!ks.length)throw 0;
    if(!confirm('Esto sustituirá los datos actuales por los de la copia. ¿Continuar?'))return;
    asKeys().forEach(k=>localStorage.removeItem(k));
    ks.forEach(k=>localStorage.setItem(k,o.data[k]));location.reload()}
   catch(x){toast('Archivo no válido: no es una copia de AgendaSavia')}};r.readAsText(f)});

function editApptModal(id){
  const a=appts.find(x=>x.id===id);if(!a)return;
  if(a.paid)return toast('Cita ya cobrada: no se puede modificar');
  showModal('Editar cita',`<form id="f" class="space-y-3"><datalist id="cl">${CLIENTS.map(c=>`<option value="${esc(c.n)}">`).join('')}</datalist>
   <div><label class="${lbl}">Cliente</label><input name="client" list="cl" required value="${esc(a.client)}" class="${inp}">${a.origen==='cliente'?'<div class="text-xs text-gray-500 mt-1">Reservada por el cliente</div>':''}</div>
   <div><label class="${lbl}">Teléfono WhatsApp</label><input name="tel" type="tel" maxlength="20" value="${esc(telOf(a))}" class="${inp}"></div>
   <div><label class="${lbl}">Servicio</label><select name="svc" class="${inp}">${SERVICES.map(s=>`<option value="${s.id}" ${s.id===a.svc?'selected':''}>${esc(s.name)} · ${s.dur} min</option>`).join('')}</select></div>
   <div><label class="${lbl}">Profesional</label><select name="pro" class="${inp}">${PROS.map(p=>`<option ${p===a.pro?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
   <div class="grid grid-cols-2 gap-3"><div><label class="${lbl}">Día</label><input name="date" type="date" required min="${today()}" value="${today()}" class="${inp}"></div><div><label class="${lbl}">Hora</label><select name="start" class="${inp}">${timeOpts(a.start)}</select></div></div>
   <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="gift" ${a.gift?'checked':''} class="w-5 h-5 accent-[#D4AF37]"> Cita a 0 € / tarjeta regalo</label>
   ${a.estado==='pendiente'?`<label class="flex items-center gap-2 text-sm"><input type="checkbox" name="conf" checked class="w-5 h-5 accent-[#D4AF37]"> Confirmar cita (quitar «pendiente»)</label>`:''}<button class="${sbtn}">Guardar cambios</button>
   <button type="button" id="apWa" class="w-full py-3 rounded-lg bg-[#25D366] text-white font-semibold">📲 Enviar recordatorio por WhatsApp</button>
   <button type="button" id="apDel" class="w-full py-2.5 text-sm text-red-600">Eliminar cita</button></form>`);
  $('#f').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),s=S(f.get('svc')),start=+f.get('start'),pro=f.get('pro'),gift=!!f.get('gift'),d=f.get('date');
    if(!d||d<today())return toast('Elige hoy o un día posterior');
    if(start+s.dur>END)return toast('La cita termina después del cierre');
    if(isToday(d)&&gift&&!a.gift&&zeroLeft()<=0)return toast('Cupo diario de citas a 0 € completo');
    const others=isToday(d)?[...appts.filter(x=>x!==a),...blocks]:futQ().filter(x=>x.date===d);
    if(others.some(x=>x.pro===pro&&start<x.start+x.dur&&x.start<start+s.dur)&&!confirm('Ese hueco ya está ocupado. ¿Guardar igualmente?'))return;
    Object.assign(a,{client:clean(f.get('client')),tel:cleanTel(f.get('tel')),svc:s.id,pro,start,dur:s.dur,gift});if(a.estado==='pendiente'&&f.get('conf'))a.estado='confirmada';
    if(!isToday(d)){/* mover la cita a otro día */
      appts.splice(appts.indexOf(a),1);const{id:_i,paid:_p,...rest}=a,q=futQ();q.push({...rest,rid:a.rid||newRid(),date:d,rem:0});futSave(q);state.aday=d}
    saveDay();closeModal();render();toast('Cita actualizada')};
  $('#apWa').onclick=()=>{const t=cleanTel($('#f').tel.value);if(t){a.tel=t;saveDay()}closeModal();sendWa('t:'+a.id)};
  $('#apDel').onclick=()=>{if(confirm('¿Eliminar esta cita?')){appts.splice(appts.indexOf(a),1);saveDay();closeModal();render();toast('Cita eliminada')}};
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-wa]'))return;
  const t=e.target.closest('[data-a="editAppt"],[data-a="delBlock"],[data-a="htab"],[data-a="wipe"]');if(!t)return;
  const a=t.dataset.a,id=t.dataset.id;
  if(a==='editAppt')openModal('editAppt',+id);
  else if(a==='delBlock'){const b=blocks[+id];if(b&&confirm('¿Quitar el bloqueo «'+b.label+'» de '+b.pro+' ('+fmt(b.start)+'–'+fmt(b.start+b.dur)+')?')){blocks.splice(+id,1);saveDay();render();toast('Bloqueo eliminado')}}
  else if(a==='htab'){state.htab=id;render()}
  else if(a==='wipe'&&confirm('¿Borrar TODOS los datos de AgendaSavia (en este navegador y en la nube)? Esta acción no se puede deshacer.')){
    (async()=>{
      const t=asToken();
      if(t&&window.AS_SLUG){const r=await asRpc('as_wipe',{p_slug:AS_SLUG,p_token:t},8000);if(!r.data||!r.data.ok)return toast('Sin conexión: no se pudo borrar en la nube. No se ha borrado nada.')}
      try{asKeys().forEach(k=>localStorage.removeItem(k));['as3_clean_sync','as3_clean_dirty'].forEach(k=>localStorage.removeItem(k))}catch(x){}
      location.reload()})()}
});

/* Si el correo es el de la cuenta maestra, se ocultan (y desactivan) los datos del salón */

function applyRegPromo(){

async function hashPw(pw,salt){
  try{if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']),
    b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256);
    return 'p:'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;const s=salt+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'w:'+(h>>>0).toString(16);
}
const rnd=()=>{try{return [...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return String(Date.now())+Math.random()}};
function startSession(slug,welcome){
  try{localStorage.setItem(SES_K,slug);if(welcome)sessionStorage.setItem('as3_welcome','1')}catch(e){return toast('No se pudo iniciar la sesión en este navegador')}
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  location.reload();
}
async function doReg(d){
  const user=String(d.get('user')||'').trim().toLowerCase(),pw=String(d.get('pw')),list=asAcc();
  if(!/^[a-z0-9._@+-]{3,60}$/.test(user))return toast('Correo o usuario: 3-60 caracteres (letras, números . _ - @ +)');
  if(pw.length<8)return toast('La contraseña debe tener al menos 8 caracteres');
  if(pw!==d.get('pw2'))return toast('Las contraseñas no coinciden');
  if(list.some(a=>a.user===user))return toast('Esa cuenta ya existe en este dispositivo. Inicia sesión.');
  const created=new Date().toISOString(),salt=rnd(),hash=await hashPw(pw,salt);
  /* ---- Registro ultrarrápido de la cuenta maestra (solo correo y contraseña) ---- */
  if(user===AS_ADMIN_EMAIL){
    let slug='master-admin',token='',cloud=false;
    const rr=await asRpc('as_register',{p_slug:slug,p_exact:true,p:{center:'Master Admin',phone:'',user,salt,hash,rq:'',rsalt:'',rhash:'',plan:'master',promo:'',created}},12000);
    if(rr.data&&rr.data.ok){slug=rr.data.slug;token=rr.data.token;cloud=true}
    else if(rr.data&&rr.data.error==='user_taken')return toast('Esa cuenta ya existe. Inicia sesión.');
    list.push({slug,center:'Master Admin',phone:'',user,salt,hash,plan:'master',promo:null,created,cloud,role:'master'});
    asSave(list);asSetToken(token);return startSession(slug,false);
  }
  const center=clean(d.get('center')||''),phone=cleanTel(d.get('phone'));
  if(center.length<2)return toast('Escribe el nombre de tu centro');
  const vip=asIsVipUser(user);
  if(!vip&&!R.plan){$('#rplanErr').classList.remove('hidden');$('#rplanErr').scrollIntoView({block:'center',behavior:'smooth'});return toast('Selecciona un plan')}
  const rq=String(d.get('rq')||''),ra=normAns(d.get('ra'));
  if(!RQS.includes(rq))return toast('Elige un PIN o una pregunta de seguridad');
  if(rq===RQS[0]&&!/^\d{4,8}$/.test(ra))return toast('El PIN debe tener entre 4 y 8 cifras');
  if(ra.length<4)return toast('La respuesta debe tener al menos 4 caracteres');
  if(!d.get('ok'))return toast('Debes aceptar el Aviso Legal y la Política de Privacidad');
  const plan=vip?'vip':R.plan,promo=!vip&&promoOk(R.promo,R.plan)?R.promo:null;   /* BIENVENIDA30 solo en el Plan Mensual; la cuenta VIP es gratis */
  const base=norm(center).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'centro';let slug=base,n=2;
  while(list.some(a=>a.slug===slug))slug=base+'-'+n++;
  const rsalt=rnd(),rhash=await hashPw(ra,rsalt);
  /* La cuenta se valida y se crea en la tabla «centros» de Supabase (usuario único) */
  let cloud=false,token='';
  const rr=await asRpc('as_register',{p_slug:slug,p_exact:false,p:{center,phone,user,salt,hash,rq,rsalt,rhash,plan,promo:promo||'',created}},12000);
  if(rr.data&&rr.data.ok){slug=rr.data.slug;token=rr.data.token;cloud=true}
  else if(rr.data&&rr.data.error==='user_taken')return toast('Esa cuenta ya existe. Elige otro correo o usuario');
  else if(rr.data&&rr.data.error)return toast('No se pudo crear la cuenta ('+rr.data.error+')');
  else if(window.asHasCloud&&asHasCloud()){toast('Sin conexión: la cuenta se crea en este dispositivo y se subirá a la nube al entrar con conexión');await new Promise(r=>setTimeout(r,1800))}
  if(!list.length){['as3_clean','as3_clean_ops','as3_clean_day'].forEach(k=>{try{const v=localStorage.getItem(k);if(v)localStorage.setItem('s:'+slug+':'+k,v)}catch(e){}})}
  list.push({slug,center,phone,user,salt,hash,rq,rsalt,rhash,plan,promo,created,cloud,status:'aldia'});
  asSave(list);asSetToken(token);
  startSession(slug,true);
}

/* ---------- Profesional: login ---------- */
let fails=0,lockUntil=0;
function loginView(){
  shell(`<h2 class="text-2xl font-bold mb-1">Iniciar sesión</h2><p class="text-sm text-gray-500 mb-4">Entra con el correo o usuario y la contraseña de tu cuenta.</p>
  ${asAcc().length||(window.asHasCloud&&asHasCloud())?'':`<div class="mb-4 rounded-xl border border-amber-200 bg-amber-50 text-[#8a6d12] text-sm p-3">En este dispositivo todavía no hay ninguna cuenta. Pulsa «Registrarme» para crear la tuya.</div>`}
  <form data-gf="login" class="space-y-4"><div><label class="${lbl}">Correo o usuario</label><input name="user" required autocapitalize="none" autocomplete="username" class="${inp}"></div><div><label class="${lbl}">Contraseña</label><input name="pw" type="password" required autocomplete="current-password" class="${inp}"></div><div id="lerr" class="text-sm text-red-600 min-h-[1.25rem]"></div><button class="${wide}">Entrar</button></form>
  <div class="text-sm text-center text-gray-500 mt-4 space-y-1"><div><button data-g="forgot" class="underline text-[#8a6d12]">¿Olvidaste tu contraseña?</button></div><div><button data-g="reg" class="underline">¿Aún no tienes cuenta? Regístrate</button></div><div>¿Problemas para entrar? Escribe a <a class="underline text-[#8a6d12]" href="mailto:${MAIL}">${MAIL}</a></div></div>`,'landing');
}
async function doLogin(d){
  const e=$('#lerr'),now=Date.now();
  if(now<lockUntil){e.textContent='Demasiados intentos. Espera '+Math.ceil((lockUntil-now)/1000)+' s.';return}
  const user=String(d.get('user')).trim().toLowerCase(),pw=String(d.get('pw')),la=asAcc().find(x=>x.user===user);
  const fail=()=>{fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0;e.textContent='Demasiados intentos. Espera 30 s.'}else e.textContent='Usuario o contraseña incorrectos.'};
  e.textContent='';
  /* 1) Validación en la tabla «centros» de Supabase */
  const sr=await asRpc('as_user_salt',{p_user:user},9000);
  if(!sr.error){
    if(sr.data){
      const h=await hashPw(pw,sr.data),lr=await asRpc('as_login',{p_user:user,p_hash:h},9000);
      if(lr.data){
        if(lr.data.ok){
          const ac=lr.data.account;
          asCacheAccount({slug:ac.slug,center:ac.center,phone:ac.phone||'',user:ac.user,salt:sr.data,hash:h,rq:ac.rq,rsalt:ac.rsalt,plan:ac.plan,promo:ac.promo||null,created:ac.created,cloud:true,...(ac.status?{status:ac.status}:{})});
          asSetToken(lr.data.token);fails=0;return startSession(ac.slug,false);
        }
        if(lr.data.error==='locked'){e.textContent='Demasiados intentos. Espera '+(lr.data.secs||30)+' s.';return}
        return fail();
      }
    }else if(la){
      /* cuenta creada en este dispositivo antes de la nube: se comprueba en local y se migra a Supabase */
      if((await hashPw(pw,la.salt))!==la.hash)return fail();
      const mr=await asRpc('as_register',{p_slug:la.slug,p_exact:true,p:{center:la.center,phone:la.phone||'',user:la.user,salt:la.salt,hash:la.hash,rq:la.rq,rsalt:la.rsalt,rhash:la.rhash,plan:la.plan,promo:la.promo||'',created:la.created}},12000);
      if(mr.data&&mr.data.ok){asCacheAccount({slug:la.slug,cloud:true});asSetToken(mr.data.token)}
      fails=0;return startSession(la.slug,false);
    }else return fail();
  }
  /* 2) Sin conexión o error del servidor: caché local de este dispositivo */
  if(!la){e.textContent='Sin conexión: no se puede comprobar la cuenta. Inténtalo de nuevo con internet.';return}
  if((await hashPw(pw,la.salt))!==la.hash)return fail();
  fails=0;startSession(la.slug,false);
}

/* ---------- Profesional: recuperar contraseña (PIN / pregunta de seguridad) ---------- */
let FG=null,rFails=0,rLock=0;
function forgotView(){
  FG=null;
  shell(`<h2 class="text-2xl font-bold mb-1">Recuperar contraseña</h2><p class="text-sm text-gray-500 mb-4">Escribe tu usuario y te pediremos tu PIN o tu pregunta de seguridad.</p>
  <form data-gf="forgot1" class="space-y-4"><div><label class="${lbl}">Usuario</label><input name="user" required autocapitalize="none" autocomplete="username" class="${inp}"></div><div id="ferr" class="text-sm text-red-600 min-h-[1.25rem]"></div><button class="${wide}">Continuar</button></form>`,'login');
}
async function doForgot1(d){
  const e=$('#ferr'),user=String(d.get('user')).trim().toLowerCase(),la=asAcc().find(x=>x.user===user);
  e.textContent='';
  const r=await asRpc('as_rq',{p_user:user},9000);let src=null;
  if(!r.error){
    if(r.data){if(!r.data.rq){e.innerHTML='Esta cuenta se creó sin PIN de recuperación. Escribe a <a class="underline" href="mailto:'+MAIL+'">'+MAIL+'</a>.';return}src={cloud:true,rq:r.data.rq,rsalt:r.data.rsalt}}
    else if(la){if(!la.rhash){e.innerHTML='Esta cuenta se creó sin PIN de recuperación. Escribe a <a class="underline" href="mailto:'+MAIL+'">'+MAIL+'</a>.';return}src={cloud:false,rq:la.rq,rsalt:la.rsalt}}
    else{e.textContent='No encontramos ese usuario.';return}
  }else if(la&&!la.cloud){
    if(!la.rhash){e.innerHTML='Esta cuenta se creó sin PIN de recuperación. Escribe a <a class="underline" href="mailto:'+MAIL+'">'+MAIL+'</a>.';return}
    src={cloud:false,rq:la.rq,rsalt:la.rsalt};
  }else{e.textContent=la?'Necesitas conexión a internet para recuperar la contraseña.':'No se pudo comprobar el usuario. Revisa tu conexión e inténtalo de nuevo.';return}
  FG={user,...src};forgotView2();
}
function forgotView2(){
  shell(`<h2 class="text-2xl font-bold mb-1">Recuperar contraseña</h2><p class="text-sm text-gray-500 mb-4">Usuario: <b>${esc(FG.user)}</b></p>
  <form data-gf="forgot2" class="space-y-4" autocomplete="off"><div><label class="${lbl}">${esc(FG.rq)}</label><input name="ra" required autocomplete="off" class="${inp}"></div>
  <div class="grid sm:grid-cols-2 gap-3"><div><label class="${lbl}">Nueva contraseña (mín. 8)</label><input name="pw" type="password" required minlength="8" maxlength="72" autocomplete="new-password" class="${inp}"></div><div><label class="${lbl}">Repite la contraseña</label><input name="pw2" type="password" required minlength="8" maxlength="72" autocomplete="new-password" class="${inp}"></div></div>
  <div id="ferr" class="text-sm text-red-600 min-h-[1.25rem]"></div><button class="${wide}">Cambiar contraseña y entrar</button></form>`,'forgot');
}
async function doForgot2(d){
  const e=$('#ferr'),now=Date.now();
  if(now<rLock){e.textContent='Demasiados intentos. Espera '+Math.ceil((rLock-now)/1000)+' s.';return}
  const pw=String(d.get('pw'));
  if(pw.length<8){e.textContent='La contraseña debe tener al menos 8 caracteres.';return}
  if(pw!==d.get('pw2')){e.textContent='Las contraseñas no coinciden.';return}
  if(!FG){forgotView();return}
  const rhash=await hashPw(normAns(d.get('ra')),FG.rsalt),nsalt=rnd(),nhash=await hashPw(pw,nsalt);
  const bad=()=>{rFails++;if(rFails>=5){rLock=Date.now()+30000;rFails=0;e.textContent='Demasiados intentos. Espera 30 s.'}else e.textContent='La respuesta no es correcta.'};
  if(FG.cloud){
    const r=await asRpc('as_recover',{p_user:FG.user,p_rhash:rhash,p_salt:nsalt,p_hash:nhash},9000);
    if(r.data&&r.data.ok){
      const ac=r.data.account;
      asCacheAccount({slug:ac.slug,center:ac.center,phone:ac.phone||'',user:ac.user,salt:nsalt,hash:nhash,rq:ac.rq,rsalt:ac.rsalt,plan:ac.plan,promo:ac.promo||null,created:ac.created,cloud:true});
      asSetToken(r.data.token);rFails=0;fails=0;return startSession(ac.slug,false);
    }
    if(r.data&&r.data.error==='locked'){e.textContent='Demasiados intentos. Espera '+Math.max(1,Math.ceil((r.data.secs||300)/60))+' min.';return}
    if(r.data)return bad();
    e.textContent='Necesitas conexión a internet para cambiar la contraseña.';return;
  }
  const list=asAcc(),a=list.find(x=>x.user===FG.user);
  if(!a||!a.rhash){forgotView();return}
  if(rhash!==a.rhash)return bad();
  a.salt=nsalt;a.hash=nhash;asSave(list);
  rFails=0;fails=0;startSession(a.slug,false);
}

G.addEventListener('keydown',e=>{if(e.target.id==='rpromo'&&e.key==='Enter'){e.preventDefault();applyRegPromo()}});
document.addEventListener('click',async e=>{if(e.target.closest('#logout,[data-logout]')&&confirm('¿Cerrar sesión?')){
  try{await Promise.race([asFlush(),new Promise(r=>setTimeout(r,3000))])}catch(x){}
  try{localStorage.removeItem(SES_K);localStorage.removeItem('as3_clean_token')}catch(x){}location.reload()}});

/* Mantener sincronizado el nombre del centro con la cuenta */
const _setCenter=setCenter;
setCenter=function(v){_setCenter(v);const l=asAcc(),a=l.find(x=>x.slug===window.AS_SLUG);if(a&&CENTER){a.center=CENTER;asSave(l);window.asPushAccount&&asPushAccount()}};

/* ---------- Arranque ---------- */
if(!window.AS_SLUG){
  document.body.classList.add('gate');G.classList.remove('hidden');
  landing();
}
})();
</script>
<script>
/* ===== DASHBOARD MASTER ADMIN (solo cuenta websize130@gmail.com) =====
   Datos: RPC «as_admin_list» / «as_admin_set_status» en Supabase si existen; si no, cuentas de este dispositivo.
   IMPORTANTE: la comprobación real de permisos y del bloqueo debe hacerse en el servidor (las RPC validan el token). */
(function(){
const M=$('#master');
const ST={aldia:{i:'🟢',t:'Al día',c:'bg-emerald-500/15 text-emerald-300 ring-emerald-500/30'},pendiente:{i:'🟡',t:'Pendiente',c:'bg-amber-500/15 text-amber-300 ring-amber-500/30'},bloqueado:{i:'🔴',t:'Bloqueado',c:'bg-red-500/15 text-red-300 ring-red-500/30'}};
let rows=[],src='local',q='',fil='todos',loading=false;
const mapRow=a=>({slug:String(a.slug||''),center:String(a.center||a.center_name||'—'),user:String(a.user||a.user_email||''),phone:String(a.phone||''),plan:String(a.plan||''),promo:a.promo?String(a.promo):'',created:a.created||a.created_at||'',status:ST[a.status]?a.status:'aldia'});
/* Ingreso mensual estimado de un salón (MRR): mensual 19 € (13,30 € el 1.er mes con BIENVENIDA30) · anual 149/12 */
function mrr(r){if(r.status==='bloqueado')return 0;const p=PLANS.find(x=>x.id===r.plan);if(!p)return 0;
  if(p.id==='anual')return p.p/12;const first=r.promo===PROMO.code&&r.created&&(Date.now()-new Date(r.created))<30*864e5;return first?firstPrice(p,r.promo):p.p}
const arr=r=>{if(r.status==='bloqueado')return 0;const p=PLANS.find(x=>x.id===r.plan);if(!p)return 0;return p.id==='anual'?p.p:(r.promo===PROMO.code?firstPrice(p,r.promo)+p.p*11:p.p*12)};
const amount=r=>{if(r.plan==='vip')return 'Gratis · ilimitado';const p=PLANS.find(x=>x.id===r.plan);return p?eu2(p.p)+'/'+p.per:'—'};
async function load(){
  loading=true;paint();
  const r=await asRpc('as_admin_list',{p_token:asToken()},9000);
  if(Array.isArray(r.data)){rows=r.data.map(mapRow).filter(x=>x.user.toLowerCase()!==AS_ADMIN_EMAIL);src='cloud'}
  else{rows=asAcc().filter(a=>!asIsMaster(a)).map(mapRow);src='local'}
  loading=false;paint();
}
async function setStatus(slug,st){
  const r0=rows.find(x=>x.slug===slug);if(!r0||!ST[st])return;const prev=r0.status;r0.status=st;paint();
  const l=asAcc(),a=l.find(x=>x.slug===slug);if(a){a.status=st;asSave(l)}
  const r=await asRpc('as_admin_set_status',{p_token:asToken(),p_slug:slug,p_status:st},8000);
  if(src==='cloud'&&!(r.data&&r.data.ok)){r0.status=prev;if(a){a.status=prev;asSave(l)}paint();return toast('No se pudo guardar el estado en la nube')}
  toast(ST[st].i+' '+r0.center+' · '+ST[st].t);
}
const kpiD=(l,v,s,ic)=>`<div class="mcard p-4"><div class="flex items-center justify-between text-xs text-gray-400"><span>${l}</span><span class="text-lg">${ic}</span></div><div class="text-2xl font-extrabold text-white mt-1">${v}</div>${s?`<div class="text-xs text-gray-500 mt-1">${s}</div>`:''}</div>`;
function list(){const n=norm(q.trim());return rows.filter(r=>(fil==='todos'||r.status===fil)&&(!n||norm(r.center+' '+r.user+' '+r.phone+' '+r.slug).includes(n)))}
function tbody(){
  const L=list();
  if(!L.length)return `<tr><td colspan="7" class="px-4 py-10 text-center text-gray-500">${rows.length?'Ningún salón coincide con el filtro.':'Todavía no hay salones registrados.'}</td></tr>`;
  return L.map(r=>{const s=ST[r.status],bl=r.status==='bloqueado';
    return `<tr class="border-t border-gray-800 hover:bg-white/[.02]">
      <td class="px-4 py-3"><div class="font-semibold text-white">${esc(r.center)}</div><div class="text-xs text-gray-500">${esc(r.slug)}${r.created?' · alta '+fd(r.created):''}</div></td>
      <td class="px-4 py-3 text-gray-300">${esc(r.user)||'—'}</td>
      <td class="px-4 py-3 text-gray-300 whitespace-nowrap">${esc(r.phone)||'<span class="text-gray-600">—</span>'}</td>
      <td class="px-4 py-3 whitespace-nowrap"><div class="text-gray-200">${esc(planName(r.plan))}</div><div class="text-xs text-gray-500">${amount(r)}</div></td>
      <td class="px-4 py-3">${r.promo?`<span class="text-xs font-semibold rounded-full px-2 py-0.5 bg-[#D4AF37]/15 text-[#D4AF37]">${esc(r.promo)}</span>`:'<span class="text-gray-600">—</span>'}</td>
      <td class="px-4 py-3"><select data-mst="${esc(r.slug)}" class="text-xs rounded-full px-2 py-1 ring-1 ${s.c}" ${bl?'disabled':''}>${['aldia','pendiente'].map(k=>`<option value="${k}" ${r.status===k?'selected':''}>${ST[k].i} ${ST[k].t}</option>`).join('')}${bl?'<option selected>🔴 Bloqueado</option>':''}</select></td>
      <td class="px-4 py-3"><div class="flex gap-2 justify-end">
        <button data-mwa="${esc(r.slug)}" title="WhatsApp: aviso de pago o novedades" class="w-9 h-9 rounded-lg bg-[#25D366]/15 text-[#25D366] grid place-items-center hover:bg-[#25D366]/25">📲</button>
        <button data-mlock="${esc(r.slug)}" title="${bl?'Reactivar cuenta':'Bloquear cuenta'}" class="h-9 px-3 rounded-lg text-xs font-semibold whitespace-nowrap ${bl?'bg-emerald-500/15 text-emerald-300 hover:bg-emerald-500/25':'bg-red-500/15 text-red-300 hover:bg-red-500/25'}">${bl?'🔓 Reactivar':'🔒 Bloquear'}</button>
      </div></td></tr>`}).join('');
}
function paint(){
  const act=rows.filter(r=>r.status!=='bloqueado'),m=act.reduce((s,r)=>s+mrr(r),0),y=act.reduce((s,r)=>s+arr(r),0);
  const cnt=k=>rows.filter(r=>r.status===k).length,cup=rows.filter(r=>r.promo).length;
  const chip=(k,l)=>`<button data-mfil="${k}" class="px-3 py-1.5 rounded-full text-xs font-medium ${fil===k?'bg-[#D4AF37] text-[#111827]':'bg-white/5 text-gray-300 hover:bg-white/10'}">${l}</button>`;
  M.innerHTML=`<div class="max-w-7xl mx-auto px-4 sm:px-6 py-6" style="padding-top:calc(1.5rem + env(safe-area-inset-top,0px))">
   <header class="flex flex-wrap items-center gap-3 mb-6">
     <div class="w-11 h-11 rounded-xl bg-[#D4AF37] text-[#111827] grid place-items-center text-xl font-black">S</div>
     <div class="mr-auto"><div class="text-xl font-extrabold text-white">Agenda<span class="text-[#D4AF37]">Savia</span> <span class="text-gray-400 font-medium">· Master Admin</span></div>
       <div class="text-xs text-gray-500">${esc(AS_ADMIN_EMAIL)} · ${src==='cloud'?'☁️ Datos de la nube':'💾 Datos de este dispositivo'}${loading?' · cargando…':''}</div></div>
     <button data-mref class="px-3 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm">🔄 Actualizar</button>
     <button data-mcast class="px-3 py-2 rounded-lg bg-[#25D366] text-[#0B0F19] text-sm font-semibold">📣 Difusión</button>
     <button data-logout class="px-3 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm">⎋ Salir</button>
   </header>
   <div class="grid grid-cols-2 lg:grid-cols-6 gap-3 mb-6">
     ${kpiD('Total salones',rows.length,act.length+' con acceso'+(rows.some(r=>r.plan==='vip')?' · '+rows.filter(r=>r.plan==='vip').length+' VIP gratis':''),'🏬')}
     ${kpiD('Ingresos estimados / mes',eu2(m),'MRR de cuentas activas','💶')}
     ${kpiD('Ingresos estimados / año',eu2(y),'Proyección 12 meses','📈')}
     ${kpiD('Al día',cnt('aldia'),'Pagos correctos','🟢')}
     ${kpiD('Pendientes',cnt('pendiente'),'Pago manual por confirmar','🟡')}
     ${kpiD('Bloqueados',cnt('bloqueado'),cup+' cupón(es) '+PROMO.code+' usados','🔴')}
   </div>
   ${src==='local'?'<div class="mcard p-3 mb-4 text-xs text-amber-300 !border-amber-500/30">⚠ No se pudo leer la lista global de Supabase (RPC <code>as_admin_list</code>). Se muestran solo los salones registrados en este dispositivo.</div>':''}
   <div class="mcard overflow-hidden">
     <div class="flex flex-wrap items-center gap-2 p-4 border-b border-gray-800">
       <div class="font-semibold text-white mr-auto">Clientes / salones registrados</div>
       ${chip('todos','Todos')}${chip('aldia','🟢 Al día')}${chip('pendiente','🟡 Pendiente')}${chip('bloqueado','🔴 Bloqueado')}
       <input id="mq" type="search" value="${esc(q)}" placeholder="🔍 Buscar salón, correo o teléfono" class="w-full sm:w-64 rounded-lg px-3 py-2 text-sm">
     </div>
     <div class="overflow-x-auto"><table class="w-full text-sm min-w-[900px]"><thead class="text-left text-xs uppercase tracking-wide text-gray-500 bg-white/[.02]"><tr>
       <th class="px-4 py-3">Salón</th><th class="px-4 py-3">Correo / usuario</th><th class="px-4 py-3">Teléfono</th><th class="px-4 py-3">Plan</th><th class="px-4 py-3">Cupón</th><th class="px-4 py-3">Estado de pago</th><th class="px-4 py-3 text-right">Acciones</th></tr></thead>
       <tbody id="mtb">${tbody()}</tbody></table></div>
   </div>
   <p class="text-xs text-gray-600 mt-4">Pagos manuales por Bizum / PayPal: marca 🟡 Pendiente cuando venza una cuota, avisa por WhatsApp y usa 🔒 Bloquear si no se abona. Reactivar devuelve el acceso a la agenda.</p>
  </div>`;
}
/* ---- WhatsApp a un salón: avisos de pago o novedades ---- */
const TPL={
  pago:r=>`¡Hola ${r.center}! Te escribimos de AgendaSavia. Tu cuota del ${planName(r.plan)} (${amount(r)}) está pendiente de pago. Puedes abonarla por Bizum o PayPal y tu acceso seguirá activo. ¡Gracias!`,
  bloqueo:r=>`Hola ${r.center}, tu acceso a AgendaSavia se ha suspendido temporalmente por un pago pendiente. En cuanto recibamos el pago por Bizum o PayPal lo reactivamos al momento.`,
  reactivado:r=>`¡Hola ${r.center}! Hemos recibido tu pago y tu acceso a AgendaSavia vuelve a estar activo. ¡Gracias por confiar en nosotros!`,
  novedades:r=>`¡Hola ${r.center}! Tenemos novedades en AgendaSavia: ya puedes enviar recordatorios de citas por WhatsApp con 1 clic desde tu agenda. Cualquier duda, responde a este mensaje.`};
const TPLN={pago:'💶 Aviso de pago',bloqueo:'🔒 Aviso de bloqueo',reactivado:'✅ Cuenta reactivada',novedades:'📣 Novedades'};
function waModal(slug,k){
  const r=rows.find(x=>x.slug===slug);if(!r)return;k=k||(r.status==='bloqueado'?'bloqueo':r.status==='pendiente'?'pago':'novedades');
  const tel=waPhone(r.phone);
  showModal('📲 WhatsApp · '+r.center,`<div class="space-y-3">
    <div class="flex flex-wrap gap-2">${Object.keys(TPL).map(x=>`<button data-mtpl="${x}" data-id="${esc(slug)}" class="px-3 py-1.5 rounded-full text-xs ${x===k?'bg-[#111827] text-white':'border border-gray-300 text-gray-600'}">${TPLN[x]}</button>`).join('')}</div>
    <textarea id="mwaTxt" rows="5" class="${inp}">${esc(TPL[k](r))}</textarea>
    ${tel?`<a id="mwaGo" href="#" target="_blank" rel="noopener" class="block text-center w-full py-3 rounded-lg bg-[#25D366] text-white font-semibold">Abrir WhatsApp (+${tel})</a>`:'<p class="text-sm text-red-600">Este salón no tiene teléfono registrado.</p>'}</div>`);
  const go=$('#mwaGo');if(go){const upd=()=>go.href='https://wa.me/'+tel+'?text='+encodeURIComponent($('#mwaTxt').value);upd();$('#mwaTxt').oninput=upd}
}
function castModal(){
  const L=rows.filter(r=>r.status!=='bloqueado'&&waPhone(r.phone));
  showModal('📣 Difusión de novedades',`<div class="space-y-3"><p class="text-sm text-gray-600">Escribe el mensaje y envíalo salón a salón con un clic. Usa <b>{salon}</b> para poner el nombre de cada centro.</p>
    <textarea id="castTxt" rows="4" class="${inp}">¡Hola {salon}! Tenemos novedades en AgendaSavia: </textarea>
    <div id="castList" class="max-h-72 overflow-y-auto"></div>${L.length?'':'<p class="text-sm text-gray-500">No hay salones activos con teléfono.</p>'}</div>`);
  const paintL=()=>{const t=$('#castTxt').value;$('#castList').innerHTML=L.map(r=>`<div class="flex items-center gap-3 py-2 border-t first:border-0"><div class="flex-1 min-w-0"><div class="font-medium truncate">${esc(r.center)}</div><div class="text-xs text-gray-500">${esc(r.phone)}</div></div><a href="https://wa.me/${waPhone(r.phone)}?text=${encodeURIComponent(t.split('{salon}').join(r.center))}" target="_blank" rel="noopener" data-sent class="shrink-0 px-3 py-2 rounded-lg bg-[#25D366] text-white text-sm font-semibold">📲 Enviar</a></div>`).join('')};
  paintL();$('#castTxt').oninput=paintL;
}
M.addEventListener('click',e=>{
  const t=e.target.closest('[data-mwa],[data-mlock],[data-mfil],[data-mref],[data-mcast]');if(!t)return;const d=t.dataset;
  if(d.mwa)waModal(d.mwa);
  else if(d.mlock){const r=rows.find(x=>x.slug===d.mlock);if(!r)return;const bl=r.status==='bloqueado';
    if(confirm(bl?'¿Reactivar el acceso de '+r.center+'?':'¿Bloquear el acceso de '+r.center+' a la agenda?'))setStatus(r.slug,bl?'aldia':'bloqueado')}
  else if(d.mfil){fil=d.mfil;paint()}
  else if(d.mref!==undefined)load();
  else if(d.mcast!==undefined)castModal();
});
M.addEventListener('change',e=>{const s=e.target.dataset.mst;if(s)setStatus(s,e.target.value)});
M.addEventListener('input',e=>{if(e.target.id==='mq'){q=e.target.value;$('#mtb').innerHTML=tbody()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-mtpl]');if(t)waModal(t.dataset.id,t.dataset.mtpl);
  const s=e.target.closest('[data-sent]');if(s)setTimeout(()=>{s.textContent='✓ Enviado';s.className='shrink-0 px-3 py-2 rounded-lg border border-[#25D366] text-[#128C7E] text-sm font-semibold'},50)});
if(window.AS_SLUG&&asIsMaster(asMe())){
  document.body.classList.add('gate');M.classList.remove('hidden');document.title='Master Admin · AgendaSavia';
  paint();load();
}
})();
</script>
</body>
</html>
